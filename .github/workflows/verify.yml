name: Exact verification

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python: ["3.8", "3.12", "3.14"]
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Check release integrity
        run: python -B verify.py --check-integrity
      - name: Run complete verification
        run: python -B verify.py
      - name: Run regression tests
        run: python -B -m unittest discover -v
      - name: Check worked examples
        run: python -B worked_examples.py
